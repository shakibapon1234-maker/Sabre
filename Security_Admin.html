<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sabre Security Admin</title>
<style>body{margin:0;background:#eef2f6;color:#17212b;font:14px system-ui,Segoe UI,sans-serif}main{max-width:1100px;margin:32px auto;padding:0 18px}section{background:#fff;border-radius:10px;padding:22px;margin:18px 0;box-shadow:0 2px 12px #18263a16}h1,h2{margin-top:0}h1{color:#b6432f}label{display:block;font-weight:650;margin:10px 0 4px}input,select,button{box-sizing:border-box;padding:10px;border:1px solid #b7c2ce;border-radius:5px;font:inherit}input,select{width:100%}button{background:#087d78;color:#fff;border:0;font-weight:700;cursor:pointer;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hidden{display:none}.message{min-height:20px;color:#a12620;margin-top:12px}.ok{color:#087d78}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #dde4ea;text-align:left;vertical-align:top}small{color:#536270}@media(max-width:650px){.grid{grid-template-columns:1fr}table{font-size:12px}}</style></head>
<body><main><h1>Sabre Security Admin</h1><p>Creates accounts and controls device access. Only supervisors can use this page.</p>
<section id="login"><h2>Supervisor sign in</h2><form id="loginForm"><div class="grid"><div><label>Email</label><input id="email" type="email" required></div><div><label>Password</label><input id="password" type="password" required></div></div><button>Sign in</button></form><p class="message" id="loginMessage"></p></section>
<div id="console" class="hidden"><section><h2>Create account</h2><form id="createForm"><div class="grid"><div><label>Username</label><input id="username" required pattern="[A-Za-z0-9_.-]{3,40}"></div><div><label>Office ID</label><input id="office" required></div><div><label>User email</label><input id="newEmail" type="email" required></div><div><label>Temporary password</label><input id="newPassword" type="password" minlength="10" required></div><div><label>Role</label><select id="role"><option value="student">Student</option><option value="supervisor">Supervisor</option></select></div><div><label>Device limit</label><select id="limit"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div></div><button>Create user</button></form><p class="message" id="createMessage"></p></section>
<section><h2>Accounts and devices</h2><button id="refresh">Refresh</button><div id="table"><small>Loading…</small></div></section></div></main>
<script>
const URL='https://yajsoxywosuyyoufuxui.supabase.co', KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhanNveHl3b3N1eW91ZnV4dWkiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MDIzNjYyMCwiZXhwIjoyMTA1ODEyMjAwfQ.b4ESJvByQkje10NVjn0bJQPwUOaalV2ZvkRh8p6h3ds';let token='';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(body){const r=await fetch(URL+'/functions/v1/admin-users',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed.');return j}
async function load(){const data=await api({action:'list'}), devices={};for(const d of data.devices) (devices[d.user_id]??=[]).push(d);$('table').innerHTML='<table><tr><th>User</th><th>Role / status</th><th>Limit</th><th>Devices</th><th>Save</th></tr>'+data.profiles.map(p=>{const ds=devices[p.id]||[];return `<tr><td><b>${esc(p.username)}</b><br><small>${esc(p.email)} · ${esc(p.office_id)}</small></td><td>${esc(p.role)}<br><label><input data-active="${p.id}" type="checkbox" ${p.is_active?'checked':''}> Active</label></td><td><select data-limit="${p.id}">${[1,2,3,4,5].map(n=>`<option ${n===p.device_limit?'selected':''}>${n}</option>`).join('')}</select></td><td>${ds.map(d=>`<div>${esc(d.app_type)}: ${esc(d.device_name||'Unknown')} ${d.revoked_at?'<small>(revoked)</small>':`<button data-revoke="${d.id}">Revoke</button>`}</div>`).join('')||'<small>No devices</small>'}</td><td><button data-save="${p.id}">Save</button></td></tr>`}).join('')+'</table>'}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})}),j=await r.json();if(!r.ok)throw Error(j.error_description||'Sign in failed.');token=j.access_token;await load();$('login').classList.add('hidden');$('console').classList.remove('hidden')}catch(err){$('loginMessage').textContent=err.message}};
$('createForm').onsubmit=async e=>{e.preventDefault();try{await api({action:'create',username:$('username').value,office_id:$('office').value,email:$('newEmail').value,password:$('newPassword').value,role:$('role').value,device_limit:+$('limit').value});$('createForm').reset();$('createMessage').className='message ok';$('createMessage').textContent='User created.';await load()}catch(err){$('createMessage').className='message';$('createMessage').textContent=err.message}};
$('refresh').onclick=()=>load().catch(e=>alert(e.message));$('table').onclick=async e=>{const b=e.target;if(b.dataset.revoke&&confirm('Revoke this device?')){await api({action:'revoke_device',device_id:b.dataset.revoke});load()}if(b.dataset.save){const id=b.dataset.save;await api({action:'update',user_id:id,device_limit:+document.querySelector(`[data-limit="${id}"]`).value,is_active:document.querySelector(`[data-active="${id}"]`).checked});load()}};
</script></body></html>
